name: Wechselkurse aktualisieren

# Jeden Samstag um 05:00 UTC (Kurse vom Freitag). Von Hand: Actions → Wechselkurse aktualisieren → Run workflow.
on:
  schedule:
    - cron: "0 5 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kurse der EZB holen
        run: python3 tools/update_rates.py catalog/v1.json

      - name: Katalog prüfen
        run: python3 tools/validate_catalog.py catalog/v1.json

      - name: Speichern
        id: commit
        run: |
          if git diff --quiet; then
            echo "Keine Änderung"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Wechselkurse vom $(python3 -c 'import json; print(json.load(open("catalog/v1.json"))["exchangeRates"]["date"])')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Website neu veröffentlichen
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Pushes mit dem Workflow-Token lösen nicht immer einen neuen Pages-Build aus, deshalb ausdrücklich anstossen.
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages-Build läuft bereits"
